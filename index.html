<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Robux Recycle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0f1115;
    color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

  .sidebar {
    background: #14171d;
    border-right: 1px solid #1e2229;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px 18px;
    border-bottom: 1px solid #1e2229;
    margin-bottom: 12px;
  }
  .brand-logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px; color: #fff;
  }
  .brand-name { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
  .brand-name span { color: #ef4444; }
  .nav-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: #6b7280; padding: 12px 10px 4px; font-weight: 700;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13.5px; font-weight: 600;
    color: #9ca3af;
    cursor: pointer;
    transition: all 0.12s;
    user-select: none;
  }
  .nav-item:hover { background: #1a1e25; color: #e8eaed; }
  .nav-item.active { background: #1e2229; color: #ef4444; }
  .nav-item .ico { width: 16px; text-align: center; font-size: 14px; }

  .main { padding: 16px 20px 40px; max-width: 1100px; width: 100%; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .balance {
    display: flex; align-items: center; gap: 12px;
    background: #14171d;
    border: 1px solid #1e2229;
    border-radius: 10px;
    padding: 8px 14px;
  }
  .balance-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .balance-amount { font-size: 16px; font-weight: 800; color: #ef4444; font-variant-numeric: tabular-nums; }
  .reset-btn {
    background: transparent;
    border: 1px solid #2a2f38;
    color: #9ca3af;
    font-size: 11px; padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
  }
  .reset-btn:hover { border-color: #ef4444; color: #ef4444; }

  .game-panel { display: none; }
  .game-panel.active { display: block; }

  .game-card {
    background: #14171d;
    border: 1px solid #1e2229;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 12px;
    align-items: end;
    margin-top: 16px;
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 6px; }
  .ctrl-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
  .ctrl-input {
    background: #0f1115;
    border: 1px solid #2a2f38;
    color: #e8eaed;
    height: 42px;
    padding: 0 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-variant-numeric: tabular-nums;
    font-family: inherit;
    width: 100%;
  }
  .ctrl-input:focus { border-color: #ef4444; }

  .action-btn {
    height: 42px;
    padding: 0 24px;
    border: 0;
    border-radius: 8px;
    background: #ef4444;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.12s;
    font-family: inherit;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .action-btn:hover { background: #dc2626; }
  .action-btn:active { transform: translateY(1px); }
  .action-btn:disabled { background: #2a2f38; color: #6b7280; cursor: not-allowed; }
  .action-btn.green { background: #22c55e; }
  .action-btn.green:hover { background: #16a34a; }

  .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn-row .action-btn { flex: 1; min-width: 120px; }

  /* CHICKEN */
  .chicken-track {
    position: relative;
    height: 140px;
    background: #0f1115;
    border: 1px solid #2a2f38;
    border-radius: 12px;
    overflow-x: auto;
    margin: 14px 0;
    display: flex;
    align-items: center;
    scrollbar-width: none;
  }
  .chicken-track::-webkit-scrollbar { display: none; }
  .chicken-lanes {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 30px;
    gap: 40px;
    min-width: 100%;
  }
  .chicken-lane {
    position: relative;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: #1a1e25;
    border: 2px solid #2a2f38;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: #6b7280;
    font-weight: 800;
    transition: all 0.25s;
    flex-shrink: 0;
  }
  .chicken-lane.cleared { background: #0d2818; border-color: #22c55e; color: #22c55e; }
  .chicken-lane.current { border-color: #fbbf24; box-shadow: 0 0 0 4px rgba(251,191,36,0.15); }
  .chicken-lane.dead { background: #2a0f0f; border-color: #ef4444; color: #ef4444; }

  .multiplier-big {
    text-align: center;
    font-size: 44px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #22c55e;
    margin: 12px 0 6px;
    letter-spacing: -1px;
  }
  .multiplier-big.dead { color: #ef4444; }
  .multiplier-sub {
    text-align: center;
    font-size: 11px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 700;
  }

  /* MINES */
  .mines-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    max-width: 420px;
    margin: 18px auto;
  }
  .mine-tile {
    aspect-ratio: 1;
    background: #1a1e25;
    border: 1px solid #2a2f38;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .mine-tile:hover:not(.revealed):not(.mine):not(.dim) { background: #21262f; border-color: #3a4149; transform: scale(1.03); }
  .mine-tile.revealed { background: #0d2818; border-color: #22c55e; cursor: default; }
  .mine-tile.mine { background: #2a0f0f; border-color: #ef4444; cursor: default; }
  .mine-tile.dim { opacity: 0.4; cursor: default; }

  /* DICE */
  .dice-display {
    display: flex; align-items: center; justify-content: center;
    padding: 40px 0;
  }
  .dice-roll {
    font-size: 64px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #e8eaed;
    transition: all 0.2s;
    letter-spacing: -2px;
  }
  .dice-roll.win { color: #22c55e; text-shadow: 0 0 30px rgba(34,197,94,0.5); }
  .dice-roll.lose { color: #ef4444; text-shadow: 0 0 30px rgba(239,68,68,0.5); }

  .slider-wrap { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
  .slider-wrap input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: #2a2f38;
    border-radius: 4px;
    outline: none;
  }
  .slider-wrap input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #ef4444;
    cursor: pointer;
  }
  .slider-wrap input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #ef4444;
    cursor: pointer;
    border: 0;
  }

  .dice-info {
    display: flex; justify-content: center; gap: 24px;
    font-size: 12px;
    color: #6b7280;
    margin-top: 6px;
    font-weight: 600;
    flex-wrap: wrap;
  }
  .dice-info span b { color: #22c55e; }

  /* CRASH */
  .crash-display {
    height: 260px;
    background: #0f1115;
    border: 1px solid #2a2f38;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    margin: 10px 0;
  }
  .crash-curve { position: absolute; inset: 0; width: 100%; height: 100%; }
  .crash-multiplier {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 58px;
    font-weight: 900;
    color: #22c55e;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    z-index: 2;
    pointer-events: none;
  }
  .crash-multiplier.crashed { color: #ef4444; }

  /* PLINKO */
  .plinko-canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
    background: #0f1115;
    border: 1px solid #2a2f38;
    border-radius: 12px;
  }
  .plinko-history {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 14px;
    justify-content: center;
    min-height: 26px;
  }
  .plinko-chip {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .plinko-chip.win { background: rgba(34,197,94,0.15); color: #22c55e; }
  .plinko-chip.lose { background: rgba(239,68,68,0.15); color: #ef4444; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1a1e25;
    border: 1px solid #2a2f38;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 999;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.win { border-color: #22c55e; color: #22c55e; }
  .toast.lose { border-color: #ef4444; color: #ef4444; }

  .mobile-toggle {
    display: none;
    background: #14171d;
    border: 1px solid #1e2229;
    color: #e8eaed;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }

  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      width: 240px;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.25s;
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle { display: block; }
    .main { padding: 14px 14px 40px; }
    .controls { grid-template-columns: 1fr; }
    .dice-roll { font-size: 48px; }
    .multiplier-big { font-size: 34px; }
    .crash-multiplier { font-size: 40px; }
    .crash-display { height: 200px; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">R$</div>
      <div class="brand-name">Robux <span>Recycle</span></div>
    </div>

    <div class="nav-label">Games</div>
    <div class="nav-item active" data-game="chicken"><span class="ico">🐔</span> Chicken</div>
    <div class="nav-item" data-game="mines"><span class="ico">💎</span> Mines</div>
    <div class="nav-item" data-game="dice"><span class="ico">🎲</span> Dice</div>
    <div class="nav-item" data-game="crash"><span class="ico">📈</span> Crash</div>
    <div class="nav-item" data-game="plinko"><span class="ico">🔻</span> Plinko</div>
  </aside>

  <main class="main">

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-toggle" id="mobileToggle">☰</button>
        <div class="page-title" id="pageTitle">Chicken</div>
      </div>
      <div class="balance">
        <div>
          <div class="balance-label">Balance</div>
          <div class="balance-amount" id="balanceDisplay">20.00 R$</div>
        </div>
        <button class="reset-btn" id="resetBtn">Reset</button>
      </div>
    </div>

    <!-- CHICKEN -->
    <section class="game-panel active" id="panel-chicken">
      <div class="game-card">
        <div class="multiplier-sub">Current multiplier</div>
        <div class="multiplier-big" id="chickenMultiplier">1.00x</div>

        <div class="chicken-track">
          <div class="chicken-lanes" id="chickenLanes"></div>
        </div>

        <div class="controls">
          <div class="ctrl-group">
            <label class="ctrl-label">Bet (R$)</label>
            <input type="number" class="ctrl-input" id="chickenBet" value="5" min="0.1" step="0.1">
          </div>
          <div class="ctrl-group">
            <label class="ctrl-label">Difficulty</label>
            <select class="ctrl-input" id="chickenDifficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
              <option value="daredevil">Daredevil</option>
            </select>
          </div>
          <button class="action-btn" id="chickenStart">Start Game</button>
        </div>

        <div class="btn-row">
          <button class="action-btn green" id="chickenJump" disabled>Jump Forward</button>
          <button class="action-btn" id="chickenCash" disabled>Cash Out</button>
        </div>
      </div>
    </section>

    <!-- MINES -->
    <section class="game-panel" id="panel-mines">
      <div class="game-card">
        <div class="multiplier-sub">Current multiplier</div>
        <div class="multiplier-big" id="minesMultiplier">1.00x</div>
        <div class="mines-grid" id="minesGrid"></div>

        <div class="controls">
          <div class="ctrl-group">
            <label class="ctrl-label">Bet (R$)</label>
            <input type="number" class="ctrl-input" id="minesBet" value="5" min="0.1" step="0.1">
          </div>
          <div class="ctrl-group">
            <label class="ctrl-label">Mines</label>
            <select class="ctrl-input" id="minesCount">
              <option>1</option><option>3</option><option selected>5</option>
              <option>10</option><option>15</option><option>24</option>
            </select>
          </div>
          <button class="action-btn" id="minesStart">Start Game</button>
        </div>

        <div class="btn-row">
          <button class="action-btn" id="minesCash" disabled>Cash Out</button>
        </div>
      </div>
    </section>

    <!-- DICE -->
    <section class="game-panel" id="panel-dice">
      <div class="game-card">
        <div class="dice-display">
          <div class="dice-roll" id="diceRoll">50.00</div>
        </div>

        <div class="slider-wrap">
          <span style="font-size:12px;color:#6b7280;min-width:70px;font-weight:700">Roll under</span>
          <input type="range" id="diceSlider" min="2" max="98" value="50" step="0.5">
          <span style="font-size:15px;font-weight:800;min-width:55px;text-align:right;font-variant-numeric:tabular-nums" id="diceTargetLabel">50.00</span>
        </div>

        <div class="dice-info">
          <span>Win chance: <b id="diceChance">50.00%</b></span>
          <span>Payout: <b id="dicePayout">1.94x</b></span>
        </div>

        <div class="controls">
          <div class="ctrl-group">
            <label class="ctrl-label">Bet (R$)</label>
            <input type="number" class="ctrl-input" id="diceBet" value="5" min="0.1" step="0.1">
          </div>
          <div></div>
          <button class="action-btn" id="diceRollBtn">Roll</button>
        </div>
      </div>
    </section>

    <!-- CRASH -->
    <section class="game-panel" id="panel-crash">
      <div class="game-card">
        <div class="crash-display">
          <canvas class="crash-curve" id="crashCanvas"></canvas>
          <div class="crash-multiplier" id="crashMultiplier">1.00x</div>
        </div>

        <div class="controls">
          <div class="ctrl-group">
            <label class="ctrl-label">Bet (R$)</label>
            <input type="number" class="ctrl-input" id="crashBet" value="5" min="0.1" step="0.1">
          </div>
          <div class="ctrl-group">
            <label class="ctrl-label">Auto Cash Out (x)</label>
            <input type="number" class="ctrl-input" id="crashAuto" value="2.00" min="1.01" step="0.1">
          </div>
          <button class="action-btn" id="crashStart">Place Bet</button>
        </div>

        <div class="btn-row">
          <button class="action-btn green" id="crashCash" disabled>Cash Out</button>
        </div>
      </div>
    </section>

    <!-- PLINKO -->
    <section class="game-panel" id="panel-plinko">
      <div class="game-card">
        <canvas class="plinko-canvas" id="plinkoCanvas" width="600" height="380"></canvas>

        <div class="plinko-history" id="plinkoHistory"></div>

        <div class="controls">
          <div class="ctrl-group">
            <label class="ctrl-label">Bet (R$)</label>
            <input type="number" class="ctrl-input" id="plinkoBet" value="5" min="0.1" step="0.1">
          </div>
          <div class="ctrl-group">
            <label class="ctrl-label">Risk</label>
            <select class="ctrl-input" id="plinkoRisk">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <button class="action-btn" id="plinkoDrop">Drop Ball</button>
        </div>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ WALLET ═══════════ */
const STORAGE_KEY = "robux_recycle_balance";
const DEFAULT_BALANCE = 20;
let balance = parseFloat(localStorage.getItem(STORAGE_KEY));
if (isNaN(balance)) balance = DEFAULT_BALANCE;

function fmt(n) {
  return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + " R$";
}
function setBalance(v) {
  balance = Math.max(0, v);
  localStorage.setItem(STORAGE_KEY, balance.toString());
  document.getElementById("balanceDisplay").textContent = fmt(balance);
}
function adjustBalance(d) { setBalance(balance + d); }

document.getElementById("resetBtn").addEventListener("click", () => {
  setBalance(DEFAULT_BALANCE);
  toast("Balance reset to 20 R$", "win");
});

/* ═══════════ TOAST ═══════════ */
let toastTimer;
function toast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + (type || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = "toast " + (type || ""), 2200);
}

/* ═══════════ NAV ═══════════ */
document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
    item.classList.add("active");
    document.querySelectorAll(".game-panel").forEach(p => p.classList.remove("active"));
    document.getElementById("panel-" + item.dataset.game).classList.add("active");
    document.getElementById("pageTitle").textContent = item.textContent.replace(/^\S+\s/, "").trim();
    document.getElementById("sidebar").classList.remove("open");
  });
});
document.getElementById("mobileToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});

/* ═══════════ CHICKEN ═══════════ */
/* Casino odds — house edge ~4%. Each step is roughly a coin-flip-with-edge. */
const chickenConfig = {
  easy:      { death: 0.12, step: 1.13 },
  medium:    { death: 0.20, step: 1.24 },
  hard:      { death: 0.33, step: 1.44 },
  daredevil: { death: 0.50, step: 1.92 }
};
const chickenMaxLanes = 10;
const chickenState = { active: false, lane: 0, multiplier: 1, bet: 0, difficulty: "medium" };

function buildChickenLanes() {
  const c = document.getElementById("chickenLanes");
  c.innerHTML = "";
  for (let i = 1; i <= chickenMaxLanes; i++) {
    const lane = document.createElement("div");
    lane.className = "chicken-lane";
    lane.id = "lane-" + i;
    lane.textContent = i;
    c.appendChild(lane);
  }
}
function updateChickenLanes() {
  for (let i = 1; i <= chickenMaxLanes; i++) {
    const el = document.getElementById("lane-" + i);
    if (!el) continue;
    el.classList.toggle("cleared", i <= chickenState.lane);
    el.classList.toggle("current", i === chickenState.lane + 1 && chickenState.active);
  }
}
function chickenStart() {
  if (chickenState.active) return;
  const bet = parseFloat(document.getElementById("chickenBet").value);
  if (!bet || bet <= 0) return toast("Enter a valid bet", "lose");
  if (bet > balance) return toast("Insufficient balance", "lose");

  chickenState.active = true;
  chickenState.lane = 0;
  chickenState.multiplier = 1;
  chickenState.bet = bet;
  chickenState.difficulty = document.getElementById("chickenDifficulty").value;

  adjustBalance(-bet);
  document.getElementById("chickenMultiplier").textContent = "1.00x";
  document.getElementById("chickenMultiplier").className = "multiplier-big";
  document.getElementById("chickenStart").disabled = true;
  document.getElementById("chickenJump").disabled = false;
  document.getElementById("chickenCash").disabled = false;
  document.getElementById("chickenBet").disabled = true;
  document.getElementById("chickenDifficulty").disabled = true;

  // reset lane colors
  for (let i = 1; i <= chickenMaxLanes; i++) {
    const el = document.getElementById("lane-" + i);
    if (el) el.classList.remove("cleared", "current", "dead");
  }
  updateChickenLanes();
  toast(`Chicken started — bet ${fmt(bet)}`, "win");
}
function chickenJump() {
  if (!chickenState.active) return;
  if (chickenState.lane >= chickenMaxLanes) return;

  const cfg = chickenConfig[chickenState.difficulty];
  const survived = Math.random() > cfg.death;

  if (survived) {
    chickenState.lane++;
    chickenState.multiplier *= cfg.step;
    document.getElementById("chickenMultiplier").textContent = chickenState.multiplier.toFixed(2) + "x";
    updateChickenLanes();
    if (chickenState.lane >= chickenMaxLanes) chickenCash();
  } else {
    chickenState.active = false;
    document.getElementById("chickenMultiplier").textContent = "0.00x";
    document.getElementById("chickenMultiplier").className = "multiplier-big dead";
    document.getElementById("chickenJump").disabled = true;
    document.getElementById("chickenCash").disabled = true;
    document.getElementById("chickenStart").disabled = false;
    document.getElementById("chickenBet").disabled = false;
    document.getElementById("chickenDifficulty").disabled = false;
    const deadLane = document.getElementById("lane-" + (chickenState.lane + 1));
    if (deadLane) { deadLane.classList.remove("current"); deadLane.classList.add("dead"); }
    toast(`Busted! Lost ${fmt(chickenState.bet)}`, "lose");
  }
}
function chickenCash() {
  if (!chickenState.active) return;
  const winnings = chickenState.bet * chickenState.multiplier;
  adjustBalance(winnings);
  chickenState.active = false;
  document.getElementById("chickenStart").disabled = false;
  document.getElementById("chickenJump").disabled = true;
  document.getElementById("chickenCash").disabled = true;
  document.getElementById("chickenBet").disabled = false;
  document.getElementById("chickenDifficulty").disabled = false;
  document.getElementById("chickenMultiplier").className = "multiplier-big";
  toast(`Cashed out ${fmt(winnings)} at ${chickenState.multiplier.toFixed(2)}x`, "win");
}
document.getElementById("chickenStart").addEventListener("click", chickenStart);
document.getElementById("chickenJump").addEventListener("click", chickenJump);
document.getElementById("chickenCash").addEventListener("click", chickenCash);

const HOUSE_EDGE = 0.97;

function buildMinesGrid() {
  const grid = document.getElementById("minesGrid");
  grid.innerHTML = "";
  for (let i = 0; i < 25; i++) {
    const tile = document.createElement("div");
    tile.className = "mine-tile";
    tile.dataset.index = i;
    tile.addEventListener("click", () => minesReveal(i));
    grid.appendChild(tile);
  }

function minesMultiplierCalc(revealedCount, totalMines) {
  let mult = 1;
  const safeTotal = 25 - totalMines;
  for (let i = 0; i < revealedCount; i++) {
    mult *= (25 - i) / (safeTotal - i);
  }
  return mult * HOUSE_EDGE;
}
